    <!-- Substitua o seu botão final/submit por este formato ou adicione o id e o onclick nele -->
    <div style="text-align: center; margin: 30px 0;">
        <button type="button" id="btn-confirmar" onclick="enviarPedido()" style="padding: 12px 30px; font-weight: bold; cursor: pointer;">CONFIRMAR PEDIDO</button>
    </div>

        <script>
    function obterTextoItem(checkbox) {
        const span = checkbox.parentElement.querySelector('span');
        return span ? span.textContent.trim() : "Item desconhecido";
    }

    function enviarPedido() {
        // 1. Capturar as Entradas e seu Horário de forma segura
        const entradas = document.querySelectorAll('input[name="entrada"]:checked');
        const inputHoraEntrada = document.querySelector('input[name="hora_entrada"]');
        const horaEntrada = inputHoraEntrada ? inputHoraEntrada.value : '';

        // 2. Capturar Pratos Principais, Quentes e Carnes
        const sectionPrincipal = document.querySelectorAll('.main-dishes input[type="checkbox"]:checked, .sub-section input[type="checkbox"]:checked');
        const inputHoraPrincipal = document.querySelector('input[name="hora_principal"]');
        const horaPrincipal = inputHoraPrincipal ? inputHoraPrincipal.value : '';

        // Inicializar arrays para as seções dinâmicas
        let sobremesas = [];
        let cafes = [];
        let horaSobremesa = '';
        let horaCafe = '';

        // 3. Mapear dinamicamente as seções por texto do h2 para não misturar Café com Sobremesa
        const todasSecoes = document.querySelectorAll('.menu-section');
        todasSecoes.forEach(secao => {
            const h2 = secao.querySelector('h2');
            if (h2) {
                const textoTitulo = h2.textContent.toUpperCase();
                
                // Se for a seção de Sobremesa
                if (textoTitulo.includes('SOBREMESA') || textoTitulo.includes('SOBREMESSA')) {
                    sobremesas = secao.querySelectorAll('input[type="checkbox"]:checked');
                    const inputHora = secao.querySelector('input[type="time"]');
                    if (inputHora) horaSobremesa = inputHora.value;
                }
                
                // Se for a seção de Café
                if (textoTitulo.includes('CAFÉ') || textoTitulo.includes('CAFE')) {
                    cafes = secao.querySelectorAll('input[type="checkbox"]:checked');
                    const inputHora = secao.querySelector('input[type="time"]');
                    if (inputHora) horaCafe = inputHora.value;
                }
            }
        });

        // Validação de segurança global atualizada
        if (entradas.length === 0 && sectionPrincipal.length === 0 && sobremesas.length === 0 && cafes.length === 0) {
            alert("Por favor, selecione pelo menos um item do cardápio para continuar.");
            return;
        }

        // 4. Montar o texto legível por blocos
    const urlParams = new URLSearchParams(window.location.search);
    
    const nomeCliente   = urlParams.get('nome') || '';
    const localEvento   = urlParams.get('local') || '';
    const dataFesta     = urlParams.get('data') || '';
    const horaInicio    = urlParams.get('hora') || '';
    const qtdConvidados = urlParams.get('convidados') || '';

    // ATENÇÃO: Iniciamos o texto com o Agendamento primeiro!
    let textoResumoModal = "📋 RESUMO DO SEU PEDIDO\n---------------------------\n";
    let textoWhatsApp = "Olá! Gostaria de confirmar as escolhas para o meu evento:\n\n";

    if (nomeCliente) {
        textoResumoModal += `👤 Nome: ${nomeCliente.replace(/\+/g, ' ')}\n`; // Remove os "+" da URL se houver
        textoWhatsApp += `👤 *Nome:* ${nomeCliente.replace(/\+/g, ' ')}\n`;
    }
    if (localEvento) {
        textoResumoModal += `📍 Local: ${localEvento.replace(/\+/g, ' ')}\n`;
        textoWhatsApp += `📍 *Local:* ${localEvento.replace(/\+/g, ' ')}\n`;
    }
    if (dataFesta) {
        const dataFormatada = dataFesta.split('-').reverse().join('/');
        textoResumoModal += `📅 Data: ${dataFormatada}\n`;
        textoWhatsApp += `📅 *Data:* ${dataFormatada}\n`;
    }
    if (horaInicio) {
        // Corrige a formatação caso venha com códigos de URL (%3A)
        const horaFormatada = decodeURIComponent(horaInicio);
        textoResumoModal += `🕒 Horário: ${horaFormatada}\n`;
        textoWhatsApp += `🕒 *Horário:* ${horaFormatada}\n`;
    }
    if (qtdConvidados) {
        textoResumoModal += `👥 Convidados: ${qtdConvidados} pessoas\n`;
        textoWhatsApp += `👥 *Convidados:* ${qtdConvidados} pessoas\n`;
    }

    // Adiciona uma linha divisória antes de listar o cardápio
    textoResumoModal += "\n📝 ESCOLHAS DO CARDÁPIO:\n---------------------------\n\n";
    textoWhatsApp += "\n📝 *ESCOLHAS DO CARDÁPIO:*\n\n";



        // Bloco de Entradas
        if (entradas.length > 0) {
            textoWhatsApp += "*🔸 ENTRADAS:*\n";
            textoResumoModal += "🔸 ENTRADAS:\n";
            entradas.forEach(cb => {
                const nome = obterTextoItem(cb);
                textoWhatsApp += `  • ${nome}\n`;
                textoResumoModal += `  • ${nome}\n`;
            });
            if (horaEntrada) {
                textoWhatsApp += `⏰ _Horário para servir:_ ${horaEntrada}\n\n`;
                textoResumoModal += `⏰ Horário para servir: ${horaEntrada}\n\n`;
            } else {
                textoWhatsApp += `\n`;
                textoResumoModal += `\n`;
            }
        }

        // Bloco de Prato Principal
        if (sectionPrincipal.length > 0) {
            textoWhatsApp += "*🍽️ PRATO PRINCIPAL / ACOMPANHAMENTOS:*\n";
            textoResumoModal += "🍽️ PRATO PRINCIPAL / ACOMPANHAMENTOS:\n";
            sectionPrincipal.forEach(cb => {
                const nome = obterTextoItem(cb);
                textoWhatsApp += `  • ${nome}\n`;
                textoResumoModal += `  • ${nome}\n`;
            });
            if (horaPrincipal) {
                textoWhatsApp += `⏰ _Horário para servir:_ ${horaPrincipal}\n\n`;
                textoResumoModal += `⏰ Horário para servir: ${horaPrincipal}\n\n`;
            } else {
                textoWhatsApp += `\n`;
                textoResumoModal += `\n`;
            }
        }

        // Bloco de Sobremesas
        if (sobremesas.length > 0) {
            textoWhatsApp += "*🧁 SOBREMESAS:*\n";
            textoResumoModal += "🧁 SOBREMESAS:\n";
            sobremesas.forEach(cb => {
                const nome = obterTextoItem(cb);
                textoWhatsApp += `  • ${nome}\n`;
                textoResumoModal += `  • ${nome}\n`;
            });
            if (horaSobremesa) {
                textoWhatsApp += `⏰ _Horário para servir:_ ${horaSobremesa}\n\n`;
                textoResumoModal += `⏰ Horário para servir: ${horaSobremesa}\n\n`;
            } else {
                textoWhatsApp += `\n`;
                textoResumoModal += `\n`;
            }
        }
        
        // Bloco de Café
        if (cafes.length > 0) {
            textoWhatsApp += "*☕ CAFÉ:*\n";
            textoResumoModal += "☕ CAFÉ:\n";
            cafes.forEach(cb => {
                const nome = obterTextoItem(cb);
                textoWhatsApp += `  • ${nome}\n`;
                textoResumoModal += `  • ${nome}\n`;
            });
            if (horaCafe) {
                textoWhatsApp += `⏰ _Horário para servir:_ ${horaCafe}\n\n`;
                textoResumoModal += `⏰ Horário para servir: ${horaCafe}\n\n`;
            } else {
                textoWhatsApp += `\n`;
                textoResumoModal += `\n`;
            }
        }

                textoResumoModal += "---------------------------\nDeseja enviar esses dados para o WhatsApp do buffet?";

        // 5. Exibir Resumo e Redirecionar
        if (confirm(textoResumoModal)) {
            // Número do buffet (55 + DDD + Número)
            const numeroBuffet = 5553999922192; 
            
            // Adiciona uma quebra de linha extra e um aviso amigável no fim do texto do WhatsApp
            textoWhatsApp += "\n📌 *Agendamento enviado via formulário do site.*";
            
            // Codifica o texto para que o WhatsApp entenda os parágrafos e emojis perfeitamente
            const mensagemCodificada = encodeURIComponent(textoWhatsApp);
            
            // LINK FORÇADO PARA WHATSAPP WEB (Evita redirecionamentos para download)
            const linkWhatsApp = `https://wa.me/?5553999922192?&text=${mensagemCodificada}`;
            
            // Abre o WhatsApp com o texto preenchido na caixa de mensagem
            window.open(linkWhatsApp, '_blank');
        }

        }
    </script>
